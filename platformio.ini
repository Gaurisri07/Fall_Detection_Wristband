[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -Isensing
    -Iinclude
src_filter = 
    +<main.cpp>
    +<../sensing/imu_driver.cpp>
    +<../sensing/fall_detector.cpp>

[env:native]
platform = native
build_flags = 
    -std=c++11
    -Isensing
    -Iinclude
src_filter = 
    +<demo_native.cpp>
    +<../sensing/fall_detector.cpp>
