[platformio]
default_envs = esp32dev
src_dir = src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -Icomms
    -Isensing
build_src_filter =
    +<main.cpp>
    +<gps_module.cpp>
    +<gsm_module.cpp>

[env:native]
platform = native
build_flags =
    -std=c++11
    -Isensing
    -Iinclude
build_src_filter =
    +<demo_native.cpp>
    +<../sensing/fall_detector.cpp>
